<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">Py<span>.</span></div><div><strong>PYTHON / VISUAL LAB</strong><small>Интерактивное занятие</small></div></div>
      <div class="topbar-center"><div class="pulse"></div><span>Функции: от первого вызова до области видимости</span></div>
      <div class="header-actions">
        <div class="count-pill"><span id="currentCount">01</span><span class="count-divider">/</span>07</div>
        <button class="icon-button" type="button" data-action="fullscreen" title="Полноэкранный режим (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span>На весь экран</span></button>
      </div>
    </header>
    <div class="shell">
      <aside class="sidebar">
        <div class="sidebar-label">ПРОГРАММА УРОКА</div>
        <nav id="navigation" aria-label="Разделы занятия"></nav>
        <div class="sidebar-bottom"><div class="keyboard-icon">⌘</div><div><strong>Управление</strong><span>← → шаг · Shift + ← → тема<br>Пробел — следующий шаг · F — экран</span></div></div>
      </aside>
      <main class="main" id="main">
        <div class="slide-intro">
          <div class="eyebrow"><span class="eyebrow-dot"></span><span id="sectionNumber">РАЗДЕЛ 01</span><span class="eyebrow-sep">/</span><span id="sectionType">ОСНОВЫ</span></div>
          <h1 id="slideTitle">Как работает функция?</h1>
          <p id="slideSubtitle"></p>
        </div>
        <div id="slideContent"></div>
        <div class="bottom-bar">
          <div class="insight"><div class="insight-icon">i</div><p id="slideInsight"></p></div>
          <div class="step-controls">
            <button class="action-button ghost" data-action="reset" type="button" title="Начать объяснение заново"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11a9 9 0 1 1 3 7M3 4v7h7"/></svg><span>Сначала</span></button>
            <button class="action-button secondary" data-action="prevstep" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button>
            <button class="action-button primary" data-action="nextstep" type="button"><span id="nextStepText">Следующий шаг</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>
            <button class="action-button secondary" data-action="nextslide" type="button" title="Перейти к следующему разделу"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button>

  <script>
/* Интерактивные объяснения функций Python. Не требует интернета или библиотек. */
'use strict';

const topics = [
  {name:'Функции без параметров', label:'ПЕРВЫЙ ВЫЗОВ', title:'Функция — отдельный блок команд', subtitle:'Сначала мы описываем функцию через def, а затем запускаем её по имени. Нажимайте «Следующий шаг», чтобы увидеть реальный порядок выполнения.', insight:'<strong>def не запускает тело функции.</strong> Команды внутри выполняются только после вызова greet().', kind:'basic'},
  {name:'Преимущества функций', label:'ПОВТОРНОЕ ИСПОЛЬЗОВАНИЕ', title:'Один код — много вызовов', subtitle:'Функция позволяет не копировать одинаковые инструкции и изменять поведение программы в одном месте.', insight:'<strong>Главные преимущества:</strong> повторное использование, читаемость, удобное исправление и разбиение программы на части.', kind:'benefits'},
  {name:'Ключевое слово pass', label:'ПУСТОЙ БЛОК', title:'pass — пока ничего не делать', subtitle:'Пустое тело функции недопустимо. Ключевое слово pass временно занимает место инструкции и не выполняет полезного действия.', insight:'<strong>pass не завершает всю программу.</strong> После пустой функции выполнение продолжается со следующей строки после вызова.', kind:'pass'},
  {name:'Решение задач', label:'ПРАКТИКА БЕЗ ПАРАМЕТРОВ', title:'Собираем программу из функций', subtitle:'Три простых задачи с готовыми решениями. Скройте решение, обсудите его со студентами, затем откройте и разберите по шагам.', insight:'<strong>Практика:</strong> начните с повторяющихся действий. Выделите их в функцию, дайте понятное имя и вызовите в нужных местах.', kind:'task-basic'},
  {name:'Функции с параметрами', label:'АРГУМЕНТЫ И RETURN', title:'Передаём данные внутрь функции', subtitle:'При вызове числа попадают в параметры a и b, функция вычисляет сумму, а return возвращает результат обратно.', insight:'<strong>Аргументы</strong> — значения при вызове add(4, 7). <strong>Параметры</strong> — имена a, b в объявлении def add(a, b).', kind:'params'},
  {name:'Область видимости параметра', label:'ЛОКАЛЬНЫЕ ПЕРЕМЕННЫЕ', title:'Параметр существует внутри вызова', subtitle:'У каждого вызова есть своя локальная область. Переменная value — параметр функции, а x объявлена снаружи как глобальная переменная.', insight:'<strong>Параметры локальны.</strong> Обращение к value вне show() даст NameError. Глобальная x при этом остаётся равной 100.', kind:'scope'},
  {name:'Решение задач', label:'ПРАКТИКА С ПАРАМЕТРАМИ', title:'Решаем задачи с аргументами', subtitle:'Выберите задачу, поменяйте входные числа и проследите путь от аргументов до результата функции.', insight:'<strong>Шаблон решения:</strong> сформулировать входные данные, создать def, выполнить вычисление и вернуть ответ через return.', kind:'task-params'}
];

const basicTasks = [
  {name:'Рамка меню', desc:'Напишите функцию border(), которая рисует разделитель. Вызовите её до и после слова «МЕНЮ».', code:['def border():','    print("==========")','','border()','print("МЕНЮ")','border()'], steps:[{line:0,title:'Функция создана',desc:'Python запоминает имя border и её тело.',out:[],phase:0},{line:3,title:'Первый вызов border()',desc:'Выполнение переходит к телу функции.',out:[],phase:1},{line:1,title:'Печатаем разделитель',desc:'Функция вывела первую линию.',out:['=========='],phase:2},{line:4,title:'Выводим название',desc:'Выполнение вернулось в основную программу.',out:['==========','МЕНЮ'],phase:3},{line:5,title:'Второй вызов border()',desc:'Тот же самый код запускается ещё раз.',out:['==========','МЕНЮ'],phase:1},{line:1,title:'Выводим вторую линию',desc:'Результат — аккуратно оформленное меню.',out:['==========','МЕНЮ','=========='],phase:4}]},
  {name:'Правила игры', desc:'Создайте функцию show_rules() для вывода двух правил игры. Вызовите её из основной программы.', code:['def show_rules():','    print("1. Собери монеты")','    print("2. Найди выход")','','show_rules()'],steps:[{line:0,title:'Создаём show_rules()',desc:'Команды с отступом входят в тело функции.',out:[],phase:0},{line:4,title:'Вызываем функцию',desc:'Переходим к инструкциям внутри блока.',out:[],phase:1},{line:1,title:'Первое правило',desc:'Появилась первая строка.',out:['1. Собери монеты'],phase:2},{line:2,title:'Второе правило',desc:'Выведена и вторая строка.',out:['1. Собери монеты','2. Найди выход'],phase:4}]},
  {name:'Рисунок звезды', desc:'Определите функцию star(), которая печатает маленький рисунок из символов *. Запустите её.', code:['def star():','    print("  *  ")','    print(" *** ")','    print("*****")','','star()'],steps:[{line:0,title:'Определяем star()',desc:'Три команды print находятся внутри одной функции.',out:[],phase:0},{line:5,title:'Запускаем star()',desc:'Python переходит к первой инструкции тела.',out:[],phase:1},{line:1,title:'Верхняя строка',desc:'Вывод первой строки рисунка.',out:['  *  '],phase:2},{line:2,title:'Средняя строка',desc:'Следующий уровень рисунка.',out:['  *  ',' *** '],phase:2},{line:3,title:'Нижняя строка',desc:'Функция закончила вывод рисунка.',out:['  *  ',' *** ','*****'],phase:4}]}
];

const paramTasks = [
  {name:'Сумма двух чисел',desc:'Напишите add(a, b), возвращающую сумму. Проверьте результат на разных аргументах.',code:(a,b)=>['def add(a, b):','    return a + b','','result = add('+a+', '+b+')','print(result)'],compute:(a,b)=>a+b,resultText:r=>String(r),formula:(a,b)=>`${a} + ${b}`,steps:(a,b)=>[{line:0,title:'Определили add(a, b)',desc:'Функция ждёт два аргумента.',out:[],phase:0},{line:3,title:'Передаём аргументы',desc:`При вызове add(${a}, ${b}) параметры получают значения.`,out:[],phase:1},{line:1,title:'Выполняем сложение',desc:`Python вычисляет выражение ${a} + ${b}.`,out:[],phase:2},{line:1,title:'Возвращаем ответ',desc:`return отправляет ${a+b} в переменную result.`,out:[],phase:3},{line:4,title:'Печатаем результат',desc:'Программа выводит возвращённое число.',out:[String(a+b)],phase:4}]},
  {name:'Большее число',desc:'Создайте larger(a, b), которая возвращает большее из двух переданных чисел.',code:(a,b)=>['def larger(a, b):','    if a > b:','        return a','    return b','','print(larger('+a+', '+b+'))'],compute:(a,b)=>Math.max(a,b),resultText:r=>String(r),formula:(a,b)=>`${a} > ${b} ?`,steps:(a,b)=>[{line:0,title:'Определили larger()',desc:'Функция принимает два числа.',out:[],phase:0},{line:5,title:'Передаём аргументы',desc:`Параметры: a = ${a}, b = ${b}.`,out:[],phase:1},{line:1,title:'Проверяем условие',desc:`Условие ${a} > ${b} — ${a>b?'истина':'ложь'}.`,out:[],phase:2},{line:a>b?2:3,title:'Возвращаем максимум',desc:`Функция вернула ${Math.max(a,b)}.`,out:[],phase:3},{line:5,title:'Печатаем ответ',desc:'Вызов в print заменяется возвращённым значением.',out:[String(Math.max(a,b))],phase:4}]},
  {name:'Квадрат числа',desc:'Создайте square(n), которая возвращает квадрат числа n. Поменяйте аргумент для проверки.',code:(a)=>['def square(n):','    return n * n','','print(square('+a+'))'],compute:a=>a*a,resultText:r=>String(r),formula:a=>`${a} × ${a}`,steps:(a)=>[{line:0,title:'Определили square(n)',desc:'Функция принимает один параметр n.',out:[],phase:0},{line:3,title:'Передаём число',desc:`Параметр n получает значение ${a}.`,out:[],phase:1},{line:1,title:'Умножаем число на себя',desc:`Вычисляем ${a} × ${a}.`,out:[],phase:2},{line:1,title:'Возвращаем квадрат',desc:`return отправляет ответ ${a*a} обратно.`,out:[],phase:3},{line:3,title:'Печатаем ответ',desc:'На экране появилось возвращённое значение.',out:[String(a*a)],phase:4}]}
];

const state={slide:0,step:0,taskBasic:0,taskParam:0,showBasic:true,showParam:true,a:4,b:7,scopeError:false};
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function syntax(line){let out='',last=0;const rx=/(#.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|\b(def|return|pass|if|else|for|in|global)\b|\b(print|range|int|str)\b|\b(-?\d+)\b/g;for(const m of line.matchAll(rx)){out+=esc(line.slice(last,m.index));out+=`<span class="tok-${m[1]?'comment':m[2]?'string':m[3]?'keyword':m[4]?'builtin':'number'}">${esc(m[0])}</span>`;last=m.index+m[0].length;}return out+esc(line.slice(last));}
const normal={
  basic:{code:['def greet():','    print("Привет, Python!")','','print("До вызова")','greet()','greet()','print("После вызова")'],steps:[{line:0,title:'Объявляем функцию',desc:'Python запомнил greet(), но тело ещё не запустилось.',out:[],phase:0},{line:3,title:'Начинается основной код',desc:'Сначала выполняется print за пределами функции.',out:['До вызова'],phase:0},{line:4,title:'Первый вызов greet()',desc:'Встречая greet(), Python переходит к её телу.',out:['До вызова'],phase:1},{line:1,title:'Выполняется тело greet()',desc:'В консоль попадает первое приветствие.',out:['До вызова','Привет, Python!'],phase:2},{line:5,title:'Повторный вызов',desc:'Один и тот же блок кода запускается второй раз.',out:['До вызова','Привет, Python!'],phase:1},{line:1,title:'Второе выполнение тела',desc:'Функция снова выводит приветствие.',out:['До вызова','Привет, Python!','Привет, Python!'],phase:2},{line:6,title:'Возврат в основную программу',desc:'Остальные команды продолжают выполняться.',out:['До вызова','Привет, Python!','Привет, Python!','После вызова'],phase:4}]},
  benefits:{code:['def greet():','    print("Добрый день!")','','greet()','greet()','greet()'],steps:[{line:0,title:'Выделяем повторяемое действие',desc:'Текст приветствия хранится в одном месте — внутри функции.',out:[],phase:0},{line:3,title:'Первый вызов',desc:'Используем один и тот же блок.',out:['Добрый день!'],phase:1},{line:4,title:'Второй вызов',desc:'Не копируем print — вызываем greet().',out:['Добрый день!','Добрый день!'],phase:2},{line:5,title:'Третий вызов',desc:'Третье приветствие появилось из того же определения.',out:['Добрый день!','Добрый день!','Добрый день!'],phase:3},{line:1,title:'Меняем код в одном месте',desc:'Для изменения всех приветствий достаточно поменять только тело функции.',out:['Добрый день!','Добрый день!','Добрый день!'],phase:4}]},
  pass:{code:['def future_feature():','    pass','','print("До вызова")','future_feature()','print("После вызова")'],steps:[{line:0,title:'Функция объявлена',desc:'Пока в ней нет рабочего кода. Внутри размещён pass.',out:[],phase:0},{line:1,title:'Инструкция pass',desc:'Она допустима как временная заглушка и ничего не выводит.',out:[],phase:1},{line:3,title:'Печатаем перед вызовом',desc:'Проверяем, что основной код работает.',out:['До вызова'],phase:2},{line:4,title:'Вызываем пустую функцию',desc:'Python выполняет pass без действия и сразу возвращается.',out:['До вызова'],phase:3},{line:5,title:'Работа продолжается',desc:'После вызова программа не остановилась.',out:['До вызова','После вызова'],phase:4}]},
  params:{code:()=>['def add(a, b):','    result = a + b','    return result','','answer = add('+state.a+', '+state.b+')','print(answer)'],steps:()=>[{line:0,title:'Объявляем функцию с параметрами',desc:'a и b — локальные имена для входных данных.',out:[],phase:0},{line:4,title:'Передаём аргументы',desc:`Вызов add(${state.a}, ${state.b}) передаёт два конкретных числа.`,out:[],phase:1},{line:1,title:'Параметры получили значения',desc:`Внутри функции a = ${state.a}, b = ${state.b}.`,out:[],phase:2},{line:1,title:'Вычисляем result',desc:`Выражение ${state.a} + ${state.b} равно ${state.a+state.b}.`,out:[],phase:3},{line:2,title:'Выполняется return',desc:`Число ${state.a+state.b} передаётся обратно в answer.`,out:[],phase:4},{line:5,title:'Выводим ответ',desc:'Основная программа получила значение и вывела его.',out:[String(state.a+state.b)],phase:5}]},
  scope:{code:()=>['x = 100','','def show(value):','    print("Внутри:", value)','','show(5)','print("Снаружи:", x)',...(state.scopeError?['print(value)']:[])],steps:()=>[{line:0,title:'Глобальная переменная',desc:'Создаём x = 100 в основной программе.',out:[],phase:0},{line:2,title:'Определяем show(value)',desc:'value — параметр, который существует только внутри вызова show().',out:[],phase:1},{line:5,title:'Создаём локальную область',desc:'При show(5) появляется локальный параметр value = 5.',out:[],phase:2},{line:3,title:'Обращаемся к параметру',desc:'Функция печатает число 5, доступное внутри неё.',out:['Внутри: 5'],phase:3},{line:5,title:'Функция закончилась',desc:'Локальная область завершилась: value больше не доступен снаружи.',out:['Внутри: 5'],phase:4},{line:6,title:'Глобальная переменная на месте',desc:'x по-прежнему равна 100. Печатаем её из основной программы.',out:['Внутри: 5','Снаружи: 100'],phase:5},...(state.scopeError?[{line:7,title:'Попытка обратиться к value снаружи',desc:'Имени value в глобальной области нет — возникает NameError.',out:['Внутри: 5','Снаружи: 100',"NameError: name 'value' is not defined"],phase:6}]:[])]}
};

function getScenario(){const k=topics[state.slide].kind;if(k==='task-basic'){return basicTasks[state.taskBasic];}if(k==='task-params'){const t=paramTasks[state.taskParam];return{code:t.code(state.a,state.b),steps:t.steps(state.a,state.b)};}const r=normal[k];return{code:typeof r.code==='function'?r.code():r.code,steps:typeof r.steps==='function'?r.steps():r.steps};}
function arrow(){return '<div class="link-arrow"><svg viewBox="0 0 28 25" fill="none" stroke="#78a9bc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h21m-7-7 7 7-7 7"/></svg></div>';}
function flowBox(k,title,sub,active){return `<div class="flow-box ${active?'active':''} ${k||''}"><strong>${title}</strong><small>${sub}</small></div>`;}
function flow(items,phase){return `<div class="flow">${items.map((item,i)=>`${i?arrow():''}${flowBox('',item[0],item[1],phase===i)}`).join('')}</div>`;}
function outputHTML(lines){if(!lines.length)return '<span class="placeholder">Ожидание выполнения...</span>';return lines.map((l,i)=>`<span class="${l.startsWith('NameError')?'error':''}">${esc(l)}</span>`).join('\n');}
function renderCode(code,step,show=true){if(!show)return `<div class="code-wrap"><div class="empty-state">Решение скрыто. Предложите студентам написать функцию самостоятельно.</div></div>`;return `<div class="code-wrap">${code.map((l,i)=>`<div class="code-line ${step.line===i?'active':''}"><span class="line-number">${String(i+1).padStart(2,'0')}</span><code>${syntax(l)||' '}</code></div>`).join('')}</div>`;}
function renderTabs(items,selected,group){return `<div class="task-tabs">${items.map((t,i)=>`<button class="task-tab ${i===selected?'selected':''}" type="button" data-action="${group}" data-value="${i}">${esc(t.name)}</button>`).join('')}</div>`;}
function numberControls(two=true){const vals=[['a',state.a],...(two?[['b',state.b]]:[])];return `<div class="parameters">${vals.map(([k,v])=>`<div class="parameter-control"><label for="param-${k}">${k==='a'?'Число A':'Число B'}</label><input type="number" id="param-${k}" min="-99" max="99" value="${v}" data-param="${k}" aria-label="Значение аргумента ${k}"></div>`).join('')}</div>`;}
function boxStep(phase,stepCount){return `<div class="step-progress" aria-label="Шаг ${state.step+1} из ${stepCount}">${Array.from({length:stepCount},(_,i)=>`<div class="progress-unit ${i<=state.step?'past':''}"></div>`).join('')}</div>`;}
function sceneBasic(phase){return `<div class="diagram-heading">ПУТЬ ВЫПОЛНЕНИЯ</div>${flow([['Главный код','начало программы'],['greet()','вызов функции'],['Тело greet','print внутри'],['Консоль','получаем текст']],phase<=3?Math.min(phase,3):phase===4?1:phase===5?2:3)}<div class="row-wrap"><span class="note-chip">Объявление ≠ вызов</span><span class="note-chip">Один код можно вызвать несколько раз</span></div>`;}
function sceneBenefits(phase){return `<div class="diagram-heading">СРАВНИТЕ ДВА ПОДХОДА</div><div class="comparison"><div class="compare-card ${phase===0?'active':''}"><h3>Без функции</h3><div class="code-strip">print("Добрый день!")</div><div class="code-strip">print("Добрый день!")</div><div class="code-strip">print("Добрый день!")</div><p>Текст нужно менять в каждом повторении.</p></div><div class="compare-card ${phase>0?'active':''}"><h3>С функцией</h3><div class="code-strip clean">def greet(): ...</div><div class="code-strip clean">greet()</div><div class="code-strip clean">greet() · greet()</div><p>Место изменения одно: тело greet().</p></div></div><div class="diagram-info">${phase===4?'Изменили текст в одном определении — все будущие вызовы получат новое поведение.':`Выполнено вызовов: <strong style="color:#8ff1df">${Math.min(phase,3)}</strong> из 3. Функция остаётся одной и той же.`}</div>`;}
function scenePass(phase){return `<div class="diagram-heading">ЧТО ДЕЛАЕТ PASS</div>${flow([['future_feature()','функция существует'],['pass','пустое действие'],['Возврат','основной код']],phase===0?0:phase===1||phase===3?1:2)}<div class="comparison"><div class="state-pill ${phase===1||phase===3?'local':''}"><div class="mini-cap">Что делает pass</div><strong style="display:block;margin-top:10px;font-size:22px">Ничего</strong></div><div class="state-pill"><div class="mini-cap">Есть ли вывод от pass?</div><strong style="display:block;margin-top:10px;font-size:22px">Нет</strong></div></div><div class="diagram-info">Тело функции не может остаться совсем без инструкций. <strong>pass</strong> — корректная временная заглушка.</div>`;}
function sceneTaskBasic(phase,task){return `<div class="diagram-heading">РАЗБОР РЕШЕНИЯ</div>${flow([['Программа','основной код'],['Функция','повторяемый блок'],['Результат','консоль']],phase===0?0:phase===1?1:2)}<div class="row-wrap"><span class="note-chip">Вызов по имени</span><span class="note-chip">Без входных параметров</span></div>`;}
function sceneParams(phase){return `<div class="diagram-heading">ВХОДНЫЕ ДАННЫЕ</div>${numberControls()}<div class="diagram-heading" style="margin-top:0">КАК ЗНАЧЕНИЯ ПОПАДАЮТ В ФУНКЦИЮ</div><div class="flow" style="margin-top:0">${flowBox('',`add(${state.a}, ${state.b})`,'аргументы',phase===1)}${arrow()}${flowBox('',`a = ${state.a} · b = ${state.b}`,'параметры внутри',phase===2)}${arrow()}${flowBox('',`${state.a+state.b}`,'return / результат',phase>=4)}</div><div class="result-banner"><div><small>ВЫЧИСЛЕНИЕ ВНУТРИ</small><strong>${state.a} + ${state.b} = ${state.a+state.b}</strong></div><div class="big-number">${phase>=3?state.a+state.b:'?'}</div></div>`;}
function sceneScope(phase){let localIsVisible=phase>=2&&phase<=3;let error=phase===6;return `<div class="diagram-heading">ДВЕ РАЗНЫЕ ОБЛАСТИ ПАМЯТИ</div><div class="variable-frames"><div class="scope-frame ${(phase===0||phase===5)?'scope-active':''}"><div class="scope-head">ГЛОБАЛЬНАЯ <span>основная программа</span></div><div class="scope-value">x = 100</div><div class="scope-caption">Доступна снаружи и, при обычном чтении, внутри функции.</div></div><div class="scope-frame local-frame ${localIsVisible?'scope-active':''} ${!localIsVisible?'faded':''}"><div class="scope-head">ЛОКАЛЬНАЯ <span>show(5)</span></div><div class="scope-value">${localIsVisible?'value = 5':'—'}</div><div class="scope-caption">${localIsVisible?'Параметр создан только для этого вызова.':'За пределами вызова параметра нет.'}</div></div></div><div class="diagram-info">${error?'<span style="color:#ff9fae">Ошибка:</span> имя value недоступно за пределами show().':localIsVisible?'Параметр <strong>value</strong> живёт внутри функции. Число 5 попало сюда из вызова show(5).':'Объявленная снаружи переменная x не исчезает после вызова функции.'}</div><button class="small-button ${state.scopeError?'active':''}" type="button" data-action="scope-error">${state.scopeError?'✓ ':'＋ '}${state.scopeError?'Убрать проверку NameError':'Попробовать print(value) снаружи'}</button>`;}
function sceneTaskParams(phase,task){const one=state.taskParam===2;const result=task.compute(state.a,state.b);return `<div class="diagram-heading">ПОПРОБУЙТЕ ДРУГИЕ ЧИСЛА</div>${numberControls(!one)}<div class="flow">${flowBox('',one?`square(${state.a})`:`(${state.a}, ${state.b})`,'вызов',phase===1)}${arrow()}${flowBox('',esc(task.formula(state.a,state.b)),'вычисление',phase===2)}${arrow()}${flowBox('',String(result),'return',phase>=3)}</div><div class="result-banner"><div><small>ОТВЕТ ФУНКЦИИ</small><strong>${esc(task.name)}</strong></div><div class="big-number">${phase>=3?result:'?'}</div></div>`;}
function getScene(kind,phase,task){switch(kind){case'basic':return sceneBasic(phase);case'benefits':return sceneBenefits(phase);case'pass':return scenePass(phase);case'task-basic':return sceneTaskBasic(phase,task);case'params':return sceneParams(phase);case'scope':return sceneScope(phase);case'task-params':return sceneTaskParams(phase,task);default:return'';}}

function renderNav(){const nav=$('#navigation');nav.innerHTML=topics.map((t,i)=>`<button type="button" class="nav-item ${i===state.slide?'active':''}" data-action="slide" data-value="${i}" ${i===state.slide?'aria-current="page"':''}><span class="nav-num">${String(i+1).padStart(2,'0')}</span><span>${esc(t.name)}</span></button>`).join('');}
function render(){const t=topics[state.slide],sc=getScenario();state.step=Math.max(0,Math.min(state.step,sc.steps.length-1));const step=sc.steps[state.step],task=t.kind==='task-basic'?basicTasks[state.taskBasic]:t.kind==='task-params'?paramTasks[state.taskParam]:null,taskKind=t.kind.startsWith('task-');const isVisible=t.kind==='task-basic'?state.showBasic:t.kind==='task-params'?state.showParam:true;
 $('#currentCount').textContent=String(state.slide+1).padStart(2,'0');$('#sectionNumber').textContent=`РАЗДЕЛ ${String(state.slide+1).padStart(2,'0')}`;$('#sectionType').textContent=t.label;$('#slideTitle').textContent=t.title;$('#slideSubtitle').textContent=t.subtitle;$('#slideInsight').innerHTML=t.insight;
 const tabs=t.kind==='task-basic'?renderTabs(basicTasks,state.taskBasic,'task-basic'):t.kind==='task-params'?renderTabs(paramTasks,state.taskParam,'task-params'):'';
 const taskHeading=task?`<div class="task-toolbar"><div><div class="exercise-title">${esc(task.name)}</div><p class="exercise-desc">${esc(task.desc)}</p></div><button class="small-button ${!isVisible?'active':''}" type="button" data-action="toggle-solution">${isVisible?'Скрыть решение':'Показать решение'}</button></div>`:'';
 const codeHead=taskKind?'РЕШЕНИЕ НА PYTHON':'КОД НА PYTHON';
 $('#slideContent').innerHTML=`${tabs}${taskHeading}<div class="board animate-appear"><section class="panel"><div class="panel-heading"><h2><span class="small-dot"></span>${codeHead}</h2><span class="panel-hint">Подсветка выполняемой строки</span></div>${renderCode(sc.code,step,isVisible)}<div class="console"><div class="console-head"><span>КОНСОЛЬ / ВЫВОД</span><span>stdout</span></div><div class="console-body">${outputHTML(isVisible?step.out:[])}</div></div></section><section class="panel"><div class="panel-heading"><h2><span class="small-dot cyan"></span>ВИЗУАЛИЗАЦИЯ ВЫПОЛНЕНИЯ</h2><span class="panel-hint">Шаг ${state.step+1} / ${sc.steps.length}</span></div><div class="viz-body"><div class="scene">${getScene(t.kind,step.phase,task)}</div><div class="step-callout"><span class="step-id">${state.step+1}</span><div><strong>${esc(step.title)}</strong><p>${esc(step.desc)}</p></div></div>${boxStep(step.phase,sc.steps.length)}</div></section></div>`;
 $('#nextStepText').textContent=state.step===sc.steps.length-1?(state.slide===topics.length-1?'Повторить шаги':'К следующей теме'):'Следующий шаг';
 document.querySelector('[data-action="prevstep"]').disabled=state.step===0;
 document.querySelector('[data-action="nextslide"]').disabled=state.slide===topics.length-1;
 renderNav();
}
function setSlide(n){state.slide=Math.max(0,Math.min(topics.length-1,n));state.step=0;render();}
function nextStep(){const sc=getScenario();if(state.step<sc.steps.length-1){state.step++;render();}else if(state.slide<topics.length-1){setSlide(state.slide+1);}else{state.step=0;render();}}
function prevStep(){if(state.step>0){state.step--;render();}else if(state.slide>0){setSlide(state.slide-1);const sc=getScenario();state.step=sc.steps.length-1;render();}}
function message(txt){const el=$('#toast');el.textContent=txt;el.classList.add('show');clearTimeout(message.t);message.t=setTimeout(()=>el.classList.remove('show'),2200);}
function validateNum(v){const n=Number(v);if(!Number.isFinite(n))return null;return Math.max(-99,Math.min(99,Math.trunc(n)));}

document.addEventListener('click',ev=>{const button=ev.target.closest('button[data-action]');if(!button)return;const act=button.dataset.action;const v=Number(button.dataset.value);switch(act){case'slide':setSlide(v);break;case'nextslide':setSlide(state.slide+1);break;case'nextstep':nextStep();break;case'prevstep':prevStep();break;case'reset':state.step=0;render();break;case'task-basic':state.taskBasic=v;state.step=0;render();break;case'task-params':state.taskParam=v;state.step=0;render();break;case'toggle-solution':if(topics[state.slide].kind==='task-basic')state.showBasic=!state.showBasic;else state.showParam=!state.showParam;state.step=0;render();break;case'scope-error':state.scopeError=!state.scopeError;state.step=0;render();break;case'fullscreen':if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>message('Полный экран недоступен в этом браузере.'));}else{document.exitFullscreen?.();}break;}});
document.addEventListener('change',ev=>{const el=ev.target;if(!el.matches('input[data-param]'))return;const n=validateNum(el.value);if(n===null){message('Введите целое число от -99 до 99.');setTimeout(render,0);return;}state[el.dataset.param]=n;state.step=0;setTimeout(render,0);});
document.addEventListener('keydown',ev=>{if(ev.target.matches('input,textarea,select'))return;if(ev.key==='ArrowRight'){ev.preventDefault();if(ev.shiftKey)setSlide(state.slide+1);else nextStep();}else if(ev.key==='ArrowLeft'){ev.preventDefault();if(ev.shiftKey)setSlide(state.slide-1);else prevStep();}else if(ev.key===' '){ev.preventDefault();nextStep();}else if(ev.key.toLowerCase()==='f'){ev.preventDefault();if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.();}});
render();

</script>
</body>
</html>
